name: fresh_basket2
description: FreshBasket — Premium fresh vegetables and fruits delivery app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.0

  # Auth
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Payments
  flutterwave_standard: ^1.0.5

  # HTTP & Utils
  http: ^1.2.2
  dio: ^5.6.0

  # UI
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2

  # Email
  mailer: ^6.1.0

  # Misc
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.4.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - fres_basket_logo.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
